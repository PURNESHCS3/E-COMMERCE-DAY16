name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shophub_migrations
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shophub_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/shophub_migrations
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/shophub_tests
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BACKEND/requirements.txt

      - name: Install backend dependencies
        working-directory: BACKEND
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint backend
        working-directory: BACKEND
        run: >-
          ruff check --isolated --select E4,E7,E9,F
          --per-file-ignores
          "alembic/env.py:F401,app/routers/__init__.py:F401,app/ai_service.py:F541,app/routers/cart.py:E712,app/routers/products.py:E712,tests/conftest.py:E402"
          .

      - name: Create isolated test database
        run: |
          PGPASSWORD=postgres psql \
            --host=localhost \
            --username=postgres \
            --dbname=postgres \
            --command="CREATE DATABASE shophub_tests"

      - name: Apply database migrations
        working-directory: BACKEND
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: BACKEND
        run: pytest -q
